name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends -o Acquire::Retries=3 libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev
        timeout-minutes: 10
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - name: Binary size
        shell: bash
        run: ls -l target/release/codex-peek* | grep -v '\.d$'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Validate plugin JSON
        shell: bash
        run: |
          for f in plugin/codex-peek/hooks/hooks.json plugin/codex-peek/.codex-plugin/plugin.json .agents/plugins/marketplace.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" && echo "ok $f"
          done
